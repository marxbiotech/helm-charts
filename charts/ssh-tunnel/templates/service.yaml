apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssh-tunnel.fullname" . }}
  labels:
    {{- include "ssh-tunnel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ssh
      port: {{ .Values.service.port }}
      targetPort: ssh
      protocol: TCP
  selector:
    {{- include "ssh-tunnel.selectorLabels" . | nindent 4 }}
