apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test" (include "ssh-tunnel.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- omit (include "ssh-tunnel.labels" . | fromYaml) "app.kubernetes.io/name" | toYaml | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: banner
      image: busybox:1.37
      command: ["sh", "-ec"]
      args:
        - |
          banner=$(nc -w 5 {{ include "ssh-tunnel.fullname" . }} {{ .Values.service.port }} < /dev/null | head -n 1)
          printf '%s\n' "$banner"
          case "$banner" in SSH-2.0*) exit 0 ;; *) exit 1 ;; esac
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          memory: 16Mi
