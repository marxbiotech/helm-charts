# Default values for cronjob.
# Designed for safe use as a subchart: no resources are rendered until
# cronJob.enabled is true.

# -- CronJob configuration, rendered as the CronJob object and its spec
cronJob:
  # -- Render the CronJob. Kept false so an umbrella chart that declares this
  # chart as a dependency creates nothing until an environment opts in.
  # Grouped under `cronJob:` for parity with standalone-job's and
  # pre-hook-job's `job.enabled`, which likewise carry the enablement gate
  # alongside the object's own spec fields. Helm's dependency `condition`
  # accepts a dotted path, so a parent declares
  # `condition: <alias>.cronJob.enabled`.
  # Design Decision: `enabled` and `suspend` are separate. `enabled=false` means
  # the CronJob object does not exist; `suspend=true` means it exists but does
  # not fire. A rollout typically installs suspended, verifies the image carries
  # the subcommand, and then flips `suspend` to false.
  enabled: false

  # -- Cron schedule in standard five-field syntax, or an @-macro such as
  # @daily or @every 1h30m. Required when cronJob.enabled is true; there is no
  # default schedule, so a misconfigured release fails at template time instead
  # of silently firing.
  # Design Decision: the schema checks arity only — five whitespace-separated
  # fields, a named @-macro, or `@every <duration>` — and never inspects what a
  # field contains. Arity is a regular language and a regex expresses it
  # exactly; cron semantics are not, and the previous attempt to encode them
  # rejected valid `@every 1h30m` schedules. A semantic error such as
  # `99 99 * * *` therefore passes the schema and is rejected by the API server
  # at apply time, where the standard cron parser reads the schedule.
  schedule: ""

  # -- IANA time zone for the schedule (for example, Asia/Taipei).
  # Omitted from the manifest when empty, in which case the cluster's
  # kube-controller-manager time zone (normally UTC) applies.
  # spec.timeZone arrived in Kubernetes 1.24 as alpha and off by default, is
  # honoured from 1.25, where the feature gate is enabled by default, and is
  # stable from 1.27, where the gate is locked on; it is gone entirely from 1.29.
  # So a cluster that does not honour the field is 1.24, or one of 1.25/1.26 with
  # the gate explicitly disabled. There the API server silently drops the field
  # and the schedule runs in the cluster's time zone instead. The chart does not
  # check this.
  timeZone: ""

  # -- Suspend the schedule. The CronJob still exists and can be resumed
  # without a name change.
  suspend: false

  # -- What to do when a run is still active at the next scheduled time.
  # Allow, Forbid, or Replace.
  concurrencyPolicy: Forbid

  # -- Seconds after the scheduled time within which a missed run may still
  # start. null omits the field, so a missed run has no deadline at all and may
  # start at any time after its scheduled time. Note that the controller never
  # queues missed runs: at each sync it starts one Job for the most recent slot
  # at or before now and advances past everything older, so an outage spanning
  # several slots produces one catch-up run, not one per slot.
  # Design Decision: null remains the default because a finite deadline abandons
  # runs missed outside its window, a per-workload policy left to the operator.
  startingDeadlineSeconds: null

  # -- Number of successful finished Jobs to retain.
  successfulJobsHistoryLimit: 3
  # -- Number of failed finished Jobs to retain.
  # Design Decision: 7 rather than the Kubernetes default of 1, so a week of
  # daily failures stays inspectable after the fact.
  failedJobsHistoryLimit: 7

  # -- Additional annotations for the CronJob.
  annotations: {}
  # -- Additional labels for the CronJob.
  labels: {}

# -- Job template configuration, rendered under spec.jobTemplate
job:
  # -- Number of retries before a run is marked failed.
  # Design Decision: 0 rather than the Kubernetes default of 6. A failed
  # scheduled sweep usually means an upstream dependency is unreachable, which
  # an immediate retry does not fix while it does consume a second helping of
  # any shared rate budget. The next scheduled run is the retry.
  backoffLimit: 0
  # -- Maximum runtime in seconds for one run. Set to null to omit.
  activeDeadlineSeconds: null
  # -- Seconds to retain a finished Job. Set to null to omit and let the
  # history limits above do the cleanup.
  # This TTL and cronJob.successfulJobsHistoryLimit /
  # cronJob.failedJobsHistoryLimit both delete finished Jobs, and whichever
  # fires first wins. A TTL shorter than the period the history limits span
  # therefore overrides them silently, destroying the retained runs the limits
  # were set to keep. Keep the TTL longer than that window, or leave it null
  # and let the history limits do the cleanup alone.
  ttlSecondsAfterFinished: null
  # -- Additional annotations for the generated Jobs.
  annotations: {}
  # -- Additional labels for the generated Jobs.
  labels: {}

# -- Container image configuration
image:
  # -- Image repository. Required when cronJob.enabled is true.
  repository: ""
  # -- Image tag. Required when cronJob.enabled unless image.digest is set.
  tag: ""
  # -- Image digest. Takes precedence over image.tag.
  # Design Decision: tag and digest are deliberately allowed together, so that
  # layered values work — a base values file sets tag, an environment overlay
  # pins digest — without the overlay having to blank the tag. This matches
  # standalone-job.
  # The hazard: the digest wins in the rendered image string, so a stale digest
  # left alongside a bumped tag renders the same manifest as before. helm
  # upgrade succeeds, the object is unchanged, and the schedule keeps running
  # the old image indefinitely with nothing to show for it. standalone-job is
  # equally silent by construction — its Job name hashes the image reference,
  # but a digest short-circuits the tag before the hash is computed, so the tag
  # is not an input to the name at all whenever a digest is set. A fix belongs
  # in both charts together, the posture already taken for the label merge
  # order. Pin one or the other; blank the tag when moving a release to digest
  # pinning.
  digest: ""

# -- Image pull policy
# Design Decision: Kept top-level for parity with standalone-job, the sibling
# one-off-Job chart, so porting a values file between the two does not also
# require rewriting this key on top of the enablement key that already differs.
# Not a backward-compatibility argument: this chart is unpublished and has no
# contract to preserve. The cost is real — sample-app, pre-hook-job and k8s-ssh
# all nest this as image.pullPolicy, as does this chart's own
# tests.image.pullPolicy, so the flat spelling is a deliberate minority.
imagePullPolicy: IfNotPresent

# -- Image pull secrets for private registries
# Design Decision: Top-level here is the repo-wide convention, not the minority
# spelling above — sample-app, pre-hook-job and standalone-job all keep
# imagePullSecrets flat.
imagePullSecrets: []

# -- Command that overrides the image ENTRYPOINT
command: []
# -- Arguments that override the image CMD
args: []

# -- Environment variables for the container.
# A list, not a map, so valueFrom and fieldRef entries are expressible.
env: []
# -- ConfigMap and Secret environment sources
envFrom: []

# -- Container resource requests and limits
resources: {}

# -- Pod-level security context
podSecurityContext: {}
# -- Container-level security context
securityContext: {}

# -- Volume mounts for the container
volumeMounts: []
# -- Volumes for the pod
volumes: []

# -- Node selector constraints
nodeSelector: {}
# -- Tolerations for node taints
tolerations: []
# -- Affinity rules for pod scheduling
affinity: {}

# -- Pod restart policy. Kubernetes Jobs support Never and OnFailure.
restartPolicy: Never

# -- Service account configuration
serviceAccount:
  # -- Create a dedicated ServiceAccount when the CronJob is enabled.
  create: false
  # -- Existing ServiceAccount name. Defaults to "default" when create is false.
  name: ""
  # -- Annotations for the created ServiceAccount.
  annotations: {}

# -- Additional annotations for the run pod
podAnnotations: {}
# -- Additional labels for the run pod. These reach
# spec.jobTemplate.spec.template.metadata.labels, which is what a
# NetworkPolicy podSelector matches on.
podLabels: {}

# -- Override the chart name used in generated resource names
nameOverride: ""
# -- Override the fully qualified base resource name
fullnameOverride: ""

# -- Optional Helm test configuration. Enable it when a release should include a test pod.
tests:
  enabled: false
  image:
    repository: busybox
    tag: "1.37"
    pullPolicy: IfNotPresent
