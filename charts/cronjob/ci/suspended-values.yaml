# Rollout posture: installed suspended, no time zone, optional fields omitted.
cronJob:
  enabled: true
  schedule: "*/5 * * * *"
  suspend: true
  timeZone: ""
  startingDeadlineSeconds: null

job:
  backoffLimit: 0
  activeDeadlineSeconds: null
  ttlSecondsAfterFinished: null

image:
  repository: busybox
  tag: "1.37"

command: ["sh", "-c"]
args: ["echo 'suspended CI test'"]
