# A digest and a tag set together: the release renders successfully and the
# container image comes out as a digest reference.
cronJob:
  enabled: true
  schedule: "@daily"

image:
  repository: busybox
  tag: "1.37"
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

command: ["sh", "-c"]
args: ["echo 'digest CI test'"]
