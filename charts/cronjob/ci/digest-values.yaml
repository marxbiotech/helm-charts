# A digest-pinned release: it renders and installs, and the container image
# comes out as a digest reference. Exercises the digest branch of the image
# contract.
cronJob:
  enabled: true
  schedule: "@daily"

image:
  repository: busybox
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

command: ["sh", "-c"]
args: ["echo 'digest CI test'"]
