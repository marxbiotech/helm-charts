apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "k8s-ssh.fullname" . }}-test"
  labels:
    app.kubernetes.io/component: test
    helm.sh/chart: {{ include "k8s-ssh.chart" . }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test
      image: busybox
      command: ['sh', '-c', 'echo "k8s-ssh chart installed successfully"']
  restartPolicy: Never
