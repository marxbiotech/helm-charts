apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "k8s-ssh.fullname" . }}-test"
  labels:
    {{- include "k8s-ssh.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test
      image: busybox
      command: ['sh', '-c', 'echo "k8s-ssh chart installed successfully"']
  restartPolicy: Never
